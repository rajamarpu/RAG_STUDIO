name: Project Structure

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragstudio-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-structure.js
